[package]
name = "sara-ai-first"
version = "0.1.0"
edition = "2024"
description = "Verificador AI-first interno para projetos Godot e Defold"
repository = "https://github.com/mateuscamp/sara-engine"
publish = false

[[bin]]
name = "sara"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
regex = "1.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.8"
tree-sitter = "=0.26.13"
tree-sitter-gdscript = "=6.1.0"
tree-sitter-lua = "=0.5.0"
walkdir = "2.5.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"

# O binário distribuído em `dist/` é stripped: a medição de tamanho registrada em
# docs/RESULTADO-0.1.0.md é a do artefato publicado, não a do build cru. Deixar isso
# no perfil evita que o procedimento viva fora do repositório.
[profile.release]
strip = true

# O portão do corpus deixou de ser `#[ignore]` na ADR 0017 e passou a rodar em todo
# `cargo test`: ele varre 694 arquivos reais dos cinco projetos. Com as gramáticas
# tree-sitter sem otimização isso custava 40 s por suíte, e portão caro é portão que
# alguém desliga. Otimizar só as dependências — o código do Sara continua sem
# otimização, para o depurador e o pânico continuarem legíveis — devolve a suíte a
# 10 s sem tocar no que ela mede.
[profile.dev.package."*"]
opt-level = 2
